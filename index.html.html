<style>

@font-face{font-family:"Yekan Bakh";font-weight:400;src:local("Yekan Bakh"),local("YekanBakh-Regular"),local("Yekan Bakh Regular"),url("fonts/YekanBakh-Regular.woff2") format("woff2"),url("fonts/YekanBakh-Regular.ttf") format("truetype")}

html,body{height:100%;margin:0}
body{color:var(--tx);background:var(--bg);overflow:hidden}
body::before,body::after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
body::before{background:#059669;left:-20vmax;bottom:-25vmax}

[hidden]{display:none!important}
button{font:inherit;font-size:14px;color:var(--tx);cursor:pointer;border:1px solid var(--bd);background:rgba(255,255,255,.07);border-radius:12px;padding:9px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s,background .2s,box-shadow .2s}
button:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.pri{background:var(--g);border:0;font-weight:700;box-shadow:0 8px 24px rgba(6,182,212,.35)}
.pri:hover{background:var(--g);box-shadow:0 12px 32px rgba(16,185,129,.55)}
.ic{width:40px;height:40px;padding:0;border-radius:50%;font-size:22px;flex:none}

input:focus,select:focus{border-color:var(--cy)}
select option{background:#08222a}
input[type=time]{color-scheme:dark}
/* ورود */

.box{width:min(420px,100%);background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:30px;backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:up .6s both}

.err{color:#fca5a5;font-size:13px;min-height:20px;margin:10px 0 4px;text-align:center}
.box .pri{width:100%;padding:12px}

/* برنامه */

<script>
const SUBJ={"زیست‌شناسی":"#34d399","شیمی":"#2dd4bf","فیزیک":"#38bdf8","ریاضی":"#60a5fa","ادبیات":"#86efac","عربی":"#22d3ee","دین و زندگی":"#a7f3d0","زبان انگلیسی":"#818cf8","زمین‌شناسی":"#4ade80","سایر":"#94a3b8"};
const MON=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WD=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const TITLES={today:"برنامه امروز",weekly:"برنامه هفتگی من",cal:"تقویم ماهانه",stats:"آمار و پیشرفت",set:"پنل کاربر",plan:"برنامه‌ساز هوشمند",guide:"راهنمای استفاده"};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const fa=n=>String(n).replace(/\d/g,x=>"۰۱۲۳۴۵۶۷۸۹"[x]);
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mk=s=>new Date(s+"T12:00:00"),add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const F=new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
const J=d=>{const p={};F.formatToParts(d).forEach(x=>p[x.type]=x.value);return{y:+p.year,m:+p.month,d:+p.day}};
const wd=d=>(d.getDay()+1)%7,first=d=>add(d,-(J(d).d-1));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
async function H(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return"w"+(h>>>0)}

let now=new Date();now.setHours(12,0,0,0);
let user=null,D=null,view="today",tab="pl",sel=new Date(now),calBase=first(sel),mode="in";
let lastSave=0;
const save=()=>{if(!user)return;if(LS.set("tj_data_"+user,D)){lastSave=Date.now();const e=$("#sv");e&&(e.textContent="💾 ذخیره شد "+fa(new Date().toTimeString().slice(0,5)))}else toast("⚠️ ذخیره نشد! حافظه مرورگر پر یا بسته است؛ همین حالا یک نسخه پشتیبان دانلود کن")};
function snap(f){if(!user||!D)return;const k="tj_bak_"+user,b=LS.get(k,[]),n=Date.now();if(!f&&b[0]&&n-b[0].t<216e5)return;b.unshift({t:n,data:JSON.stringify(D)});b.length=Math.min(b.length,4);if(!LS.set(k,b)){b.length=1;LS.set(k,b)}}
setInterval(()=>snap(),6e5);addEventListener("pagehide",()=>{if(user&&D)save()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-bk]");if(!b||!user)return;const x=LS.get("tj_bak_"+user,[])[+b.dataset.bk];if(x&&confirm("اطلاعات فعلی با این نسخه جایگزین شود؟")){snap(true);D=Object.assign({tasks:[],tpl:[],acts:[],chat:[],gen:{},log:{}},JSON.parse(x.data));save();paintMe();render();toast("✅ نسخه بازیابی شد")}});

/* ---------- ورود و ثبت‌نام ---------- */
function setMode(m){mode=m;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("a",b.dataset.m==m));$("#fn").hidden=$("#fp").hidden=$("#fg").hidden=m=="in";$("#go").textContent=m=="in"?"ورود":"ساخت حساب";$("#err").textContent=""}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
async function submitAuth(){
  const u=$("#a_u").value.trim().toLowerCase(),p=$("#a_p").value,users=LS.get("tj_users",{}),er=t=>$("#err").textContent=t;
  if(!u||!p)return er("نام کاربری و رمز را وارد کن");
  if(mode=="up"){
    if(!/^[\w\u0600-\u06FF]{3,20}$/.test(u))return er("نام کاربری ۳ تا ۲۰ حرف و بدون فاصله باشه");
    if(p.length<6)return er("رمز عبور حداقل ۶ کاراکتر باشه");
    if(p!==$("#a_p2").value)return er("تکرار رمز با رمز یکی نیست");
    if(users[u])return er("این نام کاربری قبلاً ثبت شده");
    const salt=Math.random().toString(36).slice(2);
    users[u]={name:$("#a_n").value.trim()||u,g:$("#a_g").value,salt,hash:await H(salt+p),at:iso(now)};LS.set("tj_users",users);
  }else{
    const r=users[u];if(!r||r.hash!==await H(r.salt+p))return er("نام کاربری یا رمز اشتباهه");
  }
  LS.set("tj_session",u);enter(u);
}
$("#go").onclick=submitAuth;document.querySelectorAll("#auth input").forEach(i=>i.onkeydown=e=>{if(e.key=="Enter")submitAuth()});

function enter(u){
  user=u;const r=LS.get("tj_users",{})[u];
  D=Object.assign({tasks:[],tpl:[],gen:{},log:{},notes:"",exam:"2027-06-24",examName:"کنکور",lastGen:iso(now)},LS.get("tj_data_"+u,{}));D.tasks.forEach(t=>{if(t.st===undefined)t.st=t.done?"done":""});if(!D.grade&&r.g)D.grade=r.g;{const old=LS.get("tj_data_"+u,null),b=LS.get("tj_bak_"+u,null);if(old&&(!b||b.d!=iso(now)))LS.set("tj_bak_"+u,{d:iso(now),data:old})}
  if(D.timer&&D.timer.total){T=D.timer;if(T.run){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));T.run=false}if(T.left<=0){D.log[iso(now)]=(D.log[iso(now)]||0)+T.total/60;T=D.timer=null}}
  snap();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}$("#ai").hidden=false;T=D.timer&&(!D.timer.run||D.timer.end>Date.now())?D.timer:null;D.timer=T;
  let a=mk(D.lastGen);if(now-a>60*864e5)a=add(now,-60);if(a>now)a=new Date(now);
  ensure(a,add(now,14));D.lastGen=iso(now);save();
  $("#auth").hidden=true;$("#app").hidden=false;bchips=BQ;$("#bp").hidden=true;
  paintMe();
  sel=new Date(now);calBase=first(sel);view="today";render();
}
function logout(){$("#ai").hidden=true;LS.set("tj_session",null);user=D=T=null;$("#app").hidden=true;$("#auth").hidden=false;$("#a_p").value=$("#a_p2").value="";setMode("in")}

/* ---------- ساخت خودکار کارها از برنامه هفتگی ---------- */
function ensure(from,to){for(let d=new Date(from);d<=to;d=add(d,1)){const k=iso(d),w=wd(d);
  D.tpl.filter(t=>t.day==w).forEach(t=>{const g=t.id+"@"+k;if(!D.gen[g]){D.gen[g]=1;D.tasks.push({id:Date.now()+Math.random(),text:t.text,subj:t.subj,time:t.time||"",dur:t.dur||0,date:k,done:false,st:"",tpl:t.id})}})}}
const SAMPLE=[[0,"زیست‌شناسی","مطالعه فصل جدید + تست","08:00"],[0,"ریاضی","حل تمرین","16:00"],[1,"شیمی","مطالعه + تست","08:00"],[1,"فیزیک","حل مسئله","16:00"],[2,"زیست‌شناسی","مرور + تست","08:00"],[2,"ریاضی","حل تمرین","16:00"],[3,"شیمی","مطالعه + تست","08:00"],[3,"فیزیک","حل مسئله","16:00"],[4,"زیست‌شناسی","تست زمان‌دار","08:00"],[4,"ادبیات","مطالعه و تست","16:00"],[5,"ریاضی","آزمون و مرور","09:00"],[5,"دین و زندگی","مطالعه و تست","16:00"],[6,"سایر","مرور هفتگی و جمع‌بندی","10:00"]];

/* ---------- نمایش ---------- */
let T=null,AC=null;
const AVS=["🧬","🔬","🧠","🩺","🦋","🪐","🦉","🐉","🦊","🚀","🔥","👑"];
const QUOTES=["هر تستی که امروز حل می‌کنی، یه قدم به هدفت نزدیک‌ترت می‌کنه.","استمرار روزانه از مطالعه‌ی یک‌شبه خیلی مؤثرتره.","اشتباه در تست یعنی فرصتی برای یادگیری قبل از روز آزمون.","استراحت کوتاه بین دو جلسه مطالعه، تمرکز رو برمی‌گردونه.","زیست رو با درک بخون، نه فقط با حفظ کردن.","خواب کافی هم بخشی از برنامه‌ی درسیه.","کارهای کوچیکِ هر روز، نتیجه‌ی بزرگِ آخر سال رو می‌سازن."];
const byTime=(a,b)=>(a.time||"99").localeCompare(b.time||"99");
const fm=s=>pad(Math.floor(s/60))+":"+pad(s%60);
const mins=k=>Math.round(D.log[k]||0);
const doneOn=k=>D.tasks.some(t=>t.date==k&&t.done);
function streak(){let n=0,d=new Date(now);if(!doneOn(iso(d)))d=add(d,-1);while(doneOn(iso(d))){n++;d=add(d,-1)}return n}
const item=(t,rem,lbl)=>{const c=SUBJ[t.subj]||"#94a3b8",j=J(mk(t.date)),on=T&&T.id==t.id;
 return`<div class="t ${t.st}" style="--c:${c}"><div class="tx"><span class="x">${esc(t.text)}</span><span class="meta"><i></i>${se(t.subj)} ${t.subj}${t.time?` • 🕒 ${fa(t.time)}`:""}${t.dur?` • ⏱ ${fa(t.dur)} دقیقه`:""}${lbl||rem||t.st=="miss"?` • <span class="${rem?"late":""}">${fa(j.d)} ${MON[j.m-1]}</span>`:""}${on?' • <span class="run">تایمر در حال اجرا…</span>':""}</span></div>
 ${rem||t.st=="miss"?`<button class="mv" title="انتقال به روز انتخاب‌شده" data-mv="${t.id}">↪</button>`:""}<button class="ts" title="شروع تایمر" data-ts="${t.id}">▶</button>
 <button class="ok ${t.st=="done"?"on":""}" title="انجام دادم" data-st="done|${t.id}">✓</button><button class="no ${t.st=="miss"?"on":""}" title="انجام ندادم" data-st="miss|${t.id}">✕</button><button class="del" title="حذف" data-rm="${t.id}">🗑</button></div>`};
const lst=(a,rem,msg,lbl)=>a.length?a.map(t=>item(t,rem,lbl)).join(""):`<div class="empty">${msg}</div>`;

function vCal(){const cj=J(calBase),tk=iso(now);

 for(let i=0;i<wd(calBase);i++)h+="<div></div>";
 for(let d=new Date(calBase);J(d).m==cj.m;d=add(d,1)){const q=iso(d),a=D.tasks.filter(t=>t.date==q),dn=a.filter(t=>t.done).length,sb=[...new Set(a.map(t=>t.subj))].slice(0,4);

 return`<div class="card"><div class="cnav"><button class="ic" data-cm="-1">›</button><b class="mt">📆 ${MON[cj.m-1]} ${fa(cj.y)}</b><button class="ic" data-cm="1">‹</button><button data-cm="0" style="margin-inline-start:auto">📍 امروز</button></div><div class="cal">${h}</div>${calSum(cj)}</div>`}
function vStats(){const A=D.tasks.length,Dn=D.tasks.filter(t=>t.done).length,Ms=D.tasks.filter(t=>t.st=="miss").length,p=A?Math.round(Dn/A*100):0,O=D.tasks.filter(t=>!t.st&&t.date<iso(now)).length;

  <div class="card set"><h3>🎯 هدف‌ها و آزمون</h3>${f("هدف روزانه: تعداد کار","gt",D.gt||5,"number",'min="1"')}${f("هدف روزانه: دقیقه مطالعه","gm",D.gm||120,"number",'min="10"')}${f("نام آزمون هدف","examName",D.examName)}${f("تاریخ آزمون (میلادی)","exam",D.exam,"date")}</div>

function paintMe(){const r=LS.get("tj_users",{})[user];$("#un").textContent=r.name;$("#us").textContent=(D.grade?D.grade+" • ":"")+"@"+user;const a=$("#av");a.textContent=D.photo?"":(D.avatar||[...r.name][0]);a.style.background=D.photo?`center/cover url("${D.photo}")`:(D.acol||"")}

function setAc(c){D.acol=c;D.photo=null;save();paintMe();render()}
function render(){
  const keep={in:$("#in")?.value,tm:$("#tm")?.value,du:$("#du")?.value,sb:$("#sb")?.value,se:$("#se")?.value};
  const j=J(sel);$("#ttl").textContent=TITLES[view];
  $("#dt").textContent=view=="today"?`${WD[wd(sel)]}، ${fa(j.d)} ${MON[j.m-1]} ${fa(j.y)}`:"سلام "+$("#un").textContent+" 👋";
  const left=Math.ceil((mk(D.exam)-now)/864e5);$("#cd").textContent=(D.grade?"🎓 پایه "+D.grade+(left>0?" • ":""):"")+(left>0?`⏰ ${fa(left)} روز تا ${D.examName}`:"");
  document.querySelectorAll(".nv[data-v]").forEach(b=>b.classList.toggle("a",b.dataset.v==view));
  $("#view").innerHTML={today:vToday,weekly:vWeekly,cal:vCal,stats:vStats,set:vSet,plan:vPlan,guide:vGuide}[view]();
  if(view=="today"){if(keep.in!=null){$("#in").value=keep.in;$("#tm").value=keep.tm;$("#du").value=keep.du;$("#sb").value=keep.sb;$("#se").value=keep.se}renderList();$("#se").oninput=renderList;$("#in").onkeydown=e=>{if(e.key=="Enter")act("add")};$("#nt").oninput=e=>{D.notes=e.target.value;save()}}
  if(view=="set")$("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.tasks))throw 0;if(o._name){const u=LS.get("tj_users",{});u[user].name=o._name;LS.set("tj_users",u)}D=Object.assign(D,o);save();paintMe();render();toast("نسخه پشتیبان بازیابی شد")}catch(x){toast("فایل معتبر نیست")}})};
  tUI();if(view=="set"&&navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const e=$("#pst");e&&(e.textContent=p?"فعال ✓":"درخواست نشده")});
}
const go=d=>{sel=d;calBase=first(sel);if(d>=now)ensure(d,d);save();render()};

  if(a=="add"){const v=$("#in").value.trim();if(!v)return;const du=+$("#du").value||0,t={id:Date.now()+Math.random(),text:v,subj:$("#sb").value,time:$("#tm").value,date:iso(sel),done:false,st:"",dur:du};
    D.tasks.push(t);tab="pl";$("#in").value=$("#du").value="";
    if(du)toast("مدت ذخیره شد؛ برای شروع تایمر خودت روی ▶ بزن")
    save();render()}

  else if(a=="tadd"){const v=$("#tt").value.trim(),d=$("#td").value;if(!v)return;(d=="all"?[0,1,2,3,4,5,6]:[+d]).forEach(x=>D.tpl.push({id:"p"+Date.now()+Math.random(),day:x,subj:$("#ts").value,text:v,time:$("#tz").value,dur:+$("#tdu").value||0}));ensure(now,add(now,14));save();render()}
  else if(a=="sample"){if(D.tpl.length&&!confirm("برنامه فعلی با برنامه پیشنهادی جایگزین بشه؟"))return;clrTpl();SAMPLE.forEach(([d,s,t,tm],i)=>D.tpl.push({id:"p"+Date.now()+i,day:d,subj:s,text:t,time:tm}));ensure(now,add(now,14));save();render()}
  else if(a=="tclear"){if(confirm("کل برنامه هفتگی پاک بشه؟")){clrTpl();save();render()}}
  else if(a=="export"){const b=new Blob([JSON.stringify(Object.assign({_name:LS.get("tj_users",{})[user].name},D))],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=`planner-${user}-${iso(now)}.json`;l.click()}
  else if(a=="delacc"){if(confirm("حساب و همه اطلاعاتش برای همیشه حذف بشه؟")){const u=LS.get("tj_users",{});delete u[user];LS.set("tj_users",u);try{localStorage.removeItem("tj_data_"+user);localStorage.removeItem("tj_bak_"+user)}catch(e){}logout()}}
  else if(a=="out")logout();
  else if(a=="restore"){const b=LS.get("tj_bak_"+user,null);if(!b)return toast("هنوز نسخه خودکاری نیست");if(!confirm("اطلاعات فعلی با نسخه "+b.d+" جایگزین شود؟"))return;D=Object.assign({},b.data);save();paintMe();render();toast("♻️ بازگردانی شد")}
